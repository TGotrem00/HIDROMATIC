<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>HIDROMATIC - Iniciar sesión</title>

<link rel="stylesheet" href="login.css">


</head>

<body>

<main class="login-contenedor">



<section class="login-tarjeta">

    <h1>
        HIDROMATIC
    </h1>

    <p class="login-subtitulo">
        Bienvenido a la pagina oficial para configurar tu regadera!!!
    </p>


    <!-- =========================
         FORMULARIO
         ========================= -->

    <form id="form-login">

        <!-- CORREO -->

        <div class="campo">

            <label for="correo">
                Correo electrónico
            </label>

            <input
                type="email"
                id="correo"
                name="correo"
                placeholder="usuario@correo.com"
                required
            >

        </div>


        <!-- CONTRASEÑA -->

        <div class="campo">

            <label for="contraseña">
                Contraseña
            </label>

            <div class="campo-contraseña">

                <input
                    type="password"
                    id="contraseña"
                    name="contraseña"
                    placeholder="Tu contraseña"
                    required
                >

                <button
                    type="button"
                    id="btn-mostrar-contraseña"
                    aria-label="Mostrar contraseña"
                >
                    👁️
                </button>

            </div>

        </div>


        <!-- INICIAR SESIÓN -->

        <button
            type="submit"
            id="btn-login"
        >
            INICIAR SESIÓN
        </button>

    </form>


    <!-- =========================
         MODO INVITADO
         ========================= -->

    <button
        type="button"
        id="btn-invitado"
        class="btn-invitado"
    >
        MODO INVITADO
    </button>


    <!-- REGISTRO -->

    <button
        type="button"
        id="btn-registro"
        class="btn-registro"
    >
        CREAR UNA CUENTA
    </button>

</section>


</main>

<script src="login.js"></script>

</body>

</html>
